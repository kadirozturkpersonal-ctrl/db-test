name: Human Rights Daily SOP Check

on:
  workflow_dispatch:
  schedule:
    # 00:07 Istanbul is 21:07 UTC on the preceding day. Starting outside the
    # top-of-hour Actions peak improves scheduler reliability; this workflow
    # keeps exclusive access to the shared browser and D1 writer.
    - cron: '7 21 * * *'

permissions:
  contents: read

concurrency:
  group: echr-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify single live D1 target
        working-directory: ./db-old
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node d1-target.js

      - name: Install dependencies and browser
        working-directory: ./db-old
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Safely scan active Human Rights subscriptions
        id: daily_sop_check
        working-directory: ./db-old
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DATABASE_NAME: echr-db
        run: node weekly-scraper.js

      - name: Apply verified D1 stages and issue notifications
        if: success() && steps.daily_sop_check.outputs.source_available == 'true'
        env:
          HUMAN_RIGHTS_DAILY_UPDATE_URL: ${{ secrets.HUMAN_RIGHTS_DAILY_UPDATE_URL || secrets.ECHR_STAGE_NOTIFICATION_URL }}
          HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET: ${{ secrets.HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET || secrets.ECHR_STAGE_NOTIFICATION_CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$HUMAN_RIGHTS_DAILY_UPDATE_URL" ] || [ -z "$HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET" ]; then
            echo "::warning::Panel günlük güncelleme endpointi yapılandırılmamış. SOP/D1 taraması korundu; panel kuyruğu sonraki çalışmada yeniden denenecek."
            exit 0
          fi
          endpoint="${HUMAN_RIGHTS_DAILY_UPDATE_URL%/}"
          case "$endpoint" in
            */api/human-rights/daily-update) ;;
            *) endpoint="$endpoint/api/human-rights/daily-update" ;;
          esac
          set +e
          response="$(curl --fail-with-body --show-error --silent --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 --request POST "$endpoint" \
            --header "Authorization: Bearer $HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET" \
            --header "Content-Type: application/json" --data '{"dryRun":false}')"
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then
            echo "::warning::Panel günlük güncelleme isteği geçici olarak başarısız oldu. SOP/D1 taraması korundu; sonraki çalışmada yeniden denenecek."
            exit 0
          fi
          echo "$response"
          run_id="$(echo "$response" | jq -r '.run.id // empty' 2>/dev/null || true)"
          if [ -z "$run_id" ]; then
            echo "::warning::Panel günlük güncelleme yanıtı geçerli bir run kimliği içermiyor. SOP/D1 taraması korundu."
            exit 0
          fi
          for attempt in $(seq 1 80); do
            status="$(echo "$response" | jq -r '.run.status // empty' 2>/dev/null || true)"
            if [ "$status" != "running" ]; then exit 0; fi
            set +e
            response="$(curl --fail-with-body --show-error --silent --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 --request POST "$endpoint" \
              --header "Authorization: Bearer $HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET" \
              --header "Content-Type: application/json" --data "{\"runId\":\"$run_id\"}")"
            curl_exit=$?
            set -e
            if [ "$curl_exit" -ne 0 ]; then
              echo "::warning::Panel günlük güncelleme durumu alınamadı. SOP/D1 taraması korundu; sonraki çalışmada yeniden denenecek."
              exit 0
            fi
            echo "$response"
          done
          echo "::warning::Panel günlük güncelleme kuyruğu süre sınırı içinde tamamlanmadı. SOP/D1 taraması korundu; sonraki çalışmada yeniden denenecek."
          exit 0

name: Human Rights Daily SOP Check

on:
  workflow_dispatch:
  schedule:
    # 00:00 Istanbul is 21:00 UTC on the preceding day. This focused run has
    # exclusive access to the shared browser and D1 writer at that time.
    - cron: '0 21 * * *'

permissions:
  contents: read

concurrency:
  group: echr-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify single live D1 target
        working-directory: ./db-old
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node d1-target.js

      - name: Install dependencies and browser
        working-directory: ./db-old
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Safely scan active Human Rights subscriptions
        working-directory: ./db-old
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DATABASE_NAME: echr-db
        run: node weekly-scraper.js

      - name: Apply verified D1 stages and issue notifications
        env:
          HUMAN_RIGHTS_DAILY_UPDATE_URL: ${{ secrets.HUMAN_RIGHTS_DAILY_UPDATE_URL || secrets.ECHR_STAGE_NOTIFICATION_URL }}
          HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET: ${{ secrets.HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET || secrets.ECHR_STAGE_NOTIFICATION_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$HUMAN_RIGHTS_DAILY_UPDATE_URL"
          test -n "$HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET"
          endpoint="${HUMAN_RIGHTS_DAILY_UPDATE_URL%/}"
          case "$endpoint" in
            */api/human-rights/daily-update) ;;
            *) endpoint="$endpoint/api/human-rights/daily-update" ;;
          esac
          response="$(curl --fail-with-body --show-error --silent --request POST "$endpoint" \
            --header "Authorization: Bearer $HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET" \
            --header "Content-Type: application/json" --data '{"dryRun":false}')"
          echo "$response"
          run_id="$(echo "$response" | jq -r '.run.id // empty')"
          test -n "$run_id"
          for attempt in $(seq 1 80); do
            status="$(echo "$response" | jq -r '.run.status // empty')"
            if [ "$status" != "running" ]; then exit 0; fi
            response="$(curl --fail-with-body --show-error --silent --request POST "$endpoint" \
              --header "Authorization: Bearer $HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET" \
              --header "Content-Type: application/json" --data "{\"runId\":\"$run_id\"}")"
            echo "$response"
          done
          echo "Daily queue did not finish within continuation limit." >&2
          exit 1

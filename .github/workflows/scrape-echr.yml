name: ECHR Scraper

on:
  workflow_dispatch:
  schedule:
    # Türkiye saatiyle 06:00, 12:00 ve 18:00. Ayrı satırlar, yalnız 06:00
    # çalışmasının güncel yıl öncelik taramasını doğrudan başlatmasını sağlar.
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'

permissions:
  contents: write

concurrency:
  group: echr-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max - GitHub free tier limit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify single live D1 target
        working-directory: ./db-old
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node d1-target.js

      - name: Install dependencies
        working-directory: ./db-old
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./db-old
        run: npx playwright install chromium

      - name: Run scraper
        working-directory: ./db-old
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          MAX_CONSECUTIVE_EMPTY: '500'
          # Altı saatlik slotlarda günlük SOP kontrolüne ve GitHub gecikmelerine
          # güvenli pay bırakmak için ana taramayı beş saatin altında tutar.
          MAX_RUNTIME_MINUTES: '300'
          SAFE_STOP_BUFFER_MINUTES: '5'
          SCRAPER_STATE_FILE: './scraper-state.json'
          SCRAPER_SCHEDULE_SLOT: ${{ github.event.schedule == '0 3 * * *' && '06:00' || github.event.schedule == '0 9 * * *' && '12:00' || github.event.schedule == '0 15 * * *' && '18:00' || 'manual' }}
          # 06:00 Türkiye çalışması, kuyruk/D1 istek kaydı olmadan doğrudan
          # 2026'nın D1'deki en yüksek numarasından 500 geriden başlar.
          RUN_CURRENT_YEAR_PRIORITY_SCAN: ${{ github.event.schedule == '0 3 * * *' && 'true' || 'false' }}
        run: node monthly-scraper.js

      - name: Refresh HukukiPanel AİHM published data
        if: success()
        env:
          # Günlük SOP ile aynı, doğrulanmış eski/yeni secret zincirini kullan.
          # Önceki ECHR_PUBLISHED_REFRESH_* yedeği bu depoda tanımlı değildi;
          # tarama başarıyla bittiği hâlde adım bu nedenle anında kırmızı oluyordu.
          ECHR_PUBLISHED_REFRESH_URL: ${{ secrets.HUMAN_RIGHTS_DAILY_UPDATE_URL || secrets.ECHR_STAGE_NOTIFICATION_URL || secrets.ECHR_PUBLISHED_REFRESH_URL }}
          ECHR_PUBLISHED_REFRESH_SECRET: ${{ secrets.HUMAN_RIGHTS_DAILY_UPDATE_CRON_SECRET || secrets.ECHR_STAGE_NOTIFICATION_CRON_SECRET || secrets.ECHR_PUBLISHED_REFRESH_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$ECHR_PUBLISHED_REFRESH_URL" ] || [ -z "$ECHR_PUBLISHED_REFRESH_SECRET" ]; then
            echo "::error::AİHM yayımlı veri yenilemesi için URL veya yetkilendirme secret'ı yapılandırılmamış."
            exit 1
          fi
          endpoint="${ECHR_PUBLISHED_REFRESH_URL%/}"
          case "$endpoint" in
            */api/*) endpoint="${endpoint%/api/*}/api/echr-db/refresh?wait=1" ;;
            *) endpoint="$endpoint/api/echr-db/refresh?wait=1" ;;
          esac
          # Üretimdeki eski panel sürümü D1'i doğrudan okur; bu sürümde
          # kayıtlı-sürüm yenileme endpointi yoktur. Böyle bir 404, tarama
          # başarısızlığı değildir ve D1'e yazılmış verinin görünmesini
          # engellemez. Endpoint yayımlandığında aşağıdaki POST otomatik
          # olarak etkinleşir.
          preflight_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$endpoint" || true)"
          if [ "$preflight_status" = "404" ]; then
            echo "::notice::Yayımlı panel Cloudflare D1'i doğrudan okuyor; kayıtlı-sürüm yenilemesi gerekmiyor."
            exit 0
          fi
          if [ "$preflight_status" != "200" ]; then
            echo "::error::AİHM yayımlanmış veri endpointi HTTP $preflight_status döndürdü."
            exit 1
          fi
          curl --fail-with-body --show-error --silent --request POST "$endpoint" \
            --header "Authorization: Bearer $ECHR_PUBLISHED_REFRESH_SECRET" \
            --header "Content-Type: application/json" --data '{}'

      - name: Persist scraper checkpoint
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- db-old/scraper-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add db-old/scraper-state.json
            git commit -m "chore: update ECHR scraper checkpoint [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No checkpoint changes to persist."
          fi

      - name: Upload logs (if job fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: db-old/*.log
